# Cloudflare Worker for in-app reports → GitHub issues. Setup: worker/README.md
name = "kingdoms-report"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
GITHUB_REPO = "patrikliska/kingdoms-wiki"
ALLOWED_ORIGINS = "https://patrikliska.github.io"
SITE_URL = "https://patrikliska.github.io/kingdoms-wiki"

# At most 5 reports per minute from one IP address.
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (never commit them):
#   pnpm dlx wrangler secret put GITHUB_TOKEN --config worker/wrangler.toml
#   pnpm dlx wrangler secret put TURNSTILE_SECRET --config worker/wrangler.toml
